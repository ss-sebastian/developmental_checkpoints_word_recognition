[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "developmental-lm-phase1"
version = "0.1.0"
description = "Phase 1 continuous articulatory-stream next-phoneme model"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "torch>=2.1", "tqdm>=4.66"]

[project.optional-dependencies]
panphon = ["panphon>=0.22"]
colab = ["datasets>=3.0"]

[project.scripts]
devlm-phase1 = "devlm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
